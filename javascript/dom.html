<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="h1" align="center">DOM Manipulation with Attribute Selector</h1>
    <div>
        <p data-custom="first">Para 1</p>
        <p class="c2">Para 2</p>
    </div>
    <div>
        <h2>Heading2</h2>
        <p data-custom="first">Paragraph</p>
    </div>

    <script>
        document.write("<hr>");

        // Selecting first element with data-custom="first"
        var data = document.querySelector('[data-custom="first"]').innerHTML;
        document.write(data + "<br>");

        // Selecting all elements with data-custom="first"
        var data2 = document.querySelectorAll('[data-custom="first"]');

        for (let i = 0; i < data2.length; i++) {
            document.write(data2[i].innerHTML + "<br>");
        }
    </script>
</body>
</html>
