<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 ondblclick="heading()">Js events</h1>
    <form action="" name="form">
        <label for="name">Name:</label>
        <input type="text" name="input1" id="" onkeydown="keyPressed()">
    </form>
    <script>
        function keyPressed(){
            alert(`you have clicked a key ${form.input1.value}`)
        }
        function heading(){
            alert(` you had clicked on the heading`)
        }
    </script>
</body>
</html>
