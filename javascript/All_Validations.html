<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        .fs{
            margin:auto;
            margin-top: 70px;
            align-items: center;
            align-self: center;
            width:300px;
            padding:20px;
            box-shadow:2px 2px 2px 2px rgb(16, 255, 215) ;
            border-radius: 20px;
            color:white;
        }
        body{
            background-color: black;
        }
        h1{
            color:yellow;
            text-align: center;
            margin-top: 100px;
            font-family: 'lucida handwriting';
            font-size:xxx-large;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 90%;
            padding: 10px;
            margin: 5px 0 10px 0;
            border: none;
            background-color: #f1f1f1;
            border-radius: 5px;
        }

        button[type="submit"],
        button[type="reset"] {
            width: 45%;
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            margin: 5px 0 10px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Login Form</h1>
    <form onsubmit="return validateForm()">
        <fieldset class="fs">
            <label for="name" >Name:</label>
            <input type="text" name="name" id="name">
            <span id="span1" style="color:red; visibility:hidden;">*Cannot be empty</span><br><br>
            <label for="mail" >Email:</label>
            <input type="email" id="mail" name="mail">
            <span id="span2" style="color:red; visibility:hidden;">*Need the exact requirements</span><br><br>
            <label for="pass" >Password:</label>
            <input type="password" id="pass" name="pass">
            <span id="span3" style="color:red; visibility:hidden;">*Password cannot be empty</span><br><br>
            <label for="cpass">Confirm Password:</label>
            <input type="password" name="cpass" id="cpass">
            <span id="span4" style="color:red; visibility:hidden;">*Password does not match</span><br><br>


            <div class="btn">
                <button type="submit" id="submit" name="submit">Submit</button>
                <button type="reset" id="reset" name="reset">Reset</button>
            </div>
        </fieldset>
    </form>
    <script>
        function validateForm() {
            var name = document.getElementById("name");
            var email = document.getElementById("mail");
            var password = document.getElementById("pass");
            var confirmPassword = document.getElementById("cpass");
            let isValid = true;

            // Reset styles and error messages
            document.getElementById("span1").style.visibility = "hidden";
            document.getElementById("span2").style.visibility = "hidden";
            document.getElementById("span3").style.visibility = "hidden";
            document.getElementById("span4").style.visibility = "hidden";

            name.style.border = "";
            email.style.border = "";
            password.style.border = "";
            confirmPassword.style.border = "";

            if (name.value.trim() === "") {
                document.getElementById("span1").style.visibility = 'visible';
                name.style.border = "2px solid red";
                isValid = false;
            }

            if (email.value.trim() === "") {
                document.getElementById("span2").style.visibility = 'visible';
                email.style.border = "2px solid red";
                isValid = false;
            }

            if (password.value.trim() === "") {
                document.getElementById("span3").style.visibility = 'visible';
                password.style.border = "2px solid red";
                isValid = false;
            }

            if (confirmPassword.value.trim() === "") {
                document.getElementById("span4").style.visibility = 'visible';
                confirmPassword.style.border = "2px solid red";
                isValid = false;
            }

            if (password.value !== confirmPassword.value) {
                document.getElementById("span4").style.visibility = 'visible';
                confirmPassword.style.border = "2px solid red";
                isValid = false;
            }

            return isValid;
}
       
    </script>
</body>
</html>
