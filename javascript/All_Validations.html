<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        .fs{
            margin:auto;
            margin-top: 70px;
            align-items: center;
            align-self: center;
            width:300px;
            padding:20px;
            box-shadow:2px 2px 2px 2px rgb(16, 255, 215) ;
            border-radius: 20px;
            color:white;
        }
        body{
            background-color: black;
        }
        h1{
            color:yellow;
            text-align: center;
            margin-top: 100px;
            font-family: 'lucida handwriting';
            font-size:xxxwhatsapp-large;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 90%;
            padding: 10px;
            margin: 5px 0 10px 0;
            border: none;
            background-color: #f1f1f1;
            border-radius: 5px;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 45%;
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            margin: 5px 0 10px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Login Form</h1>
    <form>
        <fieldset class="fs">
            <label for="name" id="name">Name:</label>
            <input type="text" name="name" id="name">
            <label for="mail" id="mail">Email:</label>
            <input type="email" id="mail" name="mail">
            <label for="pass" id="pass">Password:</label>
            <input type="password" id="pass" name="pass">
            <label for="cpass" id="cpass">Confirm Password:</label>
            <input type="password" name="cpass" id="cpass">

            <div class="btn">
                <input type="submit" value="Submit" id="submit" name="submit">
                <input type="reset" value="Reset" id="reset" name="reset">
        </fieldset>
    </form>
</body>
</html>
