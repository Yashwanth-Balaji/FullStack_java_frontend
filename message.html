<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello</h1>
    <script>
        function hello(input2){
            document.write("You had accepted the input");
            alert(input2);
        }
        let input1=confirm("willing to continue");
        if (input1){
            let input2=prompt("Enter the name");
            hello(input2);
        }
        else    
            alert("user is not interested");
        
    </script>
</body>
</html>
